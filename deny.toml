# cargo-deny configuration: dependency security audit (RustSec advisories),
# license policy, and duplicate/bans checks. Run locally with `cargo deny check`.

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on DIRECTLY. Tauri's Linux GTK3
# stack transitively pulls the archived gtk-rs bindings (RUSTSEC-2024-041x
# family) which upstream Tauri cannot drop yet; real vulnerabilities still
# fail the check regardless of depth.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Internal `{ path = ... }` deps of unpublished crates (demo, mock wiring)
# have no version requirement by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
