name: Release to crates.io

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  publish:
    name: Verify and publish (SDK + Tauri plugin)
    runs-on: [self-hosted, macOS, ARM64]
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (token-less)
    steps:
      - uses: actions/checkout@v7
      - name: Runner PATH
        run: |
          # Later lines take PATH precedence: rustup's cargo must win over
          # the nix profile's rust-less cargo.
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "revenuecat-rs") | .version')
          echo "tag=$TAG_VERSION crate=$CRATE_VERSION"
          test "$TAG_VERSION" = "$CRATE_VERSION"

      - name: Test before publishing
        run: cargo test -p revenuecat-rs -p revenuecat-mock

      # Publish the SDK first; `cargo publish` waits for it to land in the
      # index before the plugin (which depends on it) verify-builds.
      - name: Publish SDK (revenuecat-rs)
        run: cargo publish -p revenuecat-rs --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish Tauri plugin (tauri-plugin-revenuecat)
        run: cargo publish -p tauri-plugin-revenuecat --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # npm package `tauri-plugin-revenuecat` (JS/TS bindings), published via npm
      # Trusted Publishing (OIDC) — no token. Requires `id-token: write` above
      # and a matching Trusted Publisher on npmjs.com for this repo + workflow
      # (release.yml). npm >= 11.5 exchanges the OIDC token automatically and
      # attaches provenance.
      - name: Publish npm package (tauri-plugin-revenuecat)
        working-directory: crates/tauri-plugin-revenuecat
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          test "$PKG_VERSION" = "${GITHUB_REF_NAME#v}" \
            || { echo "package.json ($PKG_VERSION) != tag (${GITHUB_REF_NAME#v})"; exit 1; }
          npm install --no-audit --no-fund   # dev: typescript + @tauri-apps/api
          npm run build                      # regenerate dist-js from guest-js
          # Use a clean userconfig so a stale local npm login on the self-hosted
          # runner doesn't shadow OIDC trusted publishing.
          export npm_config_userconfig="$(mktemp)"
          npm publish
