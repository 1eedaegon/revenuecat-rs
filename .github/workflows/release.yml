name: Release to crates.io

on:
  push:
    tags: ["v*"]
  # Manual recovery for a half-published release. Select the existing v* tag;
  # branch-based dispatches fail closed before any registry is contacted.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: stable

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - name: Install current Rust stable
        run: |
          rustup update "$RUST_STABLE" --no-self-update
          rustup default "$RUST_STABLE"

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify crate + npm versions agree (and match the tag)
        run: |
          set -euo pipefail
          # crates.io publishes are irreversible, so every version must agree
          # before either registry receives a package.
          test "$GITHUB_REF_TYPE" = "tag" \
            || { echo "Select an existing v* tag when dispatching a release"; exit 1; }
          test "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" \
            || { echo "Release tags must start with v"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not reachable from main"; exit 1; }
          CRATE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "revenuecat-rs") | .version')
          NPM_VERSION=$(node -p "require('./crates/tauri-plugin-revenuecat/package.json').version")
          echo "crate=$CRATE_VERSION npm=$NPM_VERSION ref=$GITHUB_REF_NAME ($GITHUB_REF_TYPE)"
          test "$CRATE_VERSION" = "$NPM_VERSION" \
            || { echo "package.json ($NPM_VERSION) != crate ($CRATE_VERSION)"; exit 1; }
          test "${GITHUB_REF_NAME#v}" = "$CRATE_VERSION" \
            || { echo "tag (${GITHUB_REF_NAME#v}) != crate ($CRATE_VERSION)"; exit 1; }

      - name: Rust tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: cargo test --locked --workspace --all-targets

      - name: Verify publishable crate archives
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          set -euo pipefail
          release_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "revenuecat-rs") | .version')
          package_output="$CARGO_TARGET_DIR/package"
          package_extract="$RUNNER_TEMP/revenuecat-package-verify"
          sdk_crate="$package_output/revenuecat-rs-$release_version.crate"
          plugin_crate="$package_output/tauri-plugin-revenuecat-$release_version.crate"
          sdk_dir="$package_extract/revenuecat-rs-$release_version"
          plugin_dir="$package_extract/tauri-plugin-revenuecat-$release_version"

          # One invocation, so the plugin's lockfile resolves the SDK version
          # being released instead of the newest one already on crates.io.
          cargo package --locked --no-verify -p revenuecat-rs -p tauri-plugin-revenuecat
          test -f "$sdk_crate"
          test -f "$plugin_crate"
          mkdir -p "$package_extract"
          tar -xzf "$sdk_crate" -C "$package_extract"
          tar -xzf "$plugin_crate" -C "$package_extract"
          test -f "$sdk_dir/Cargo.toml"
          test -f "$plugin_dir/Cargo.toml"

          # Library only: the SDK's tests and examples need the unpublished
          # revenuecat-mock crate, which cargo strips from the packaged manifest.
          cargo check --locked --manifest-path "$sdk_dir/Cargo.toml"
          cargo_patch="patch.crates-io.revenuecat-rs.path='$sdk_dir'"
          resolved_sdk=$(cargo metadata --format-version 1 \
            --manifest-path "$plugin_dir/Cargo.toml" \
            --config "$cargo_patch" \
            | jq -r 'first(.packages[] | select(.name == "revenuecat-rs") | .manifest_path)')
          test "$(realpath "$resolved_sdk")" = "$(realpath "$sdk_dir/Cargo.toml")"
          cargo check --manifest-path "$plugin_dir/Cargo.toml" --all-targets \
            --config "$cargo_patch"

      - name: JS build, generated output check, and tests
        working-directory: crates/tauri-plugin-revenuecat
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run build
          dist_status=$(git status --porcelain --untracked-files=all -- dist-js)
          if [ -n "$dist_status" ]; then
            echo "Generated dist-js is stale or incomplete:"
            echo "$dist_status"
            exit 1
          fi
          npm test

  publish-crates:
    name: Publish crates (SDK + Tauri plugin)
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install current Rust stable
        run: |
          rustup update "$RUST_STABLE" --no-self-update
          rustup default "$RUST_STABLE"

      # Publish the SDK first; the plugin depends on it and cargo waits for the
      # new version to land in the index. Both publishes are idempotent — a
      # version already on crates.io is skipped, so a re-run after a partial
      # failure sails past instead of dying on "already exists".
      - name: Publish SDK (revenuecat-rs)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          V=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "revenuecat-rs") | .version')
          if curl -sf -H "User-Agent: revenuecat-rs-release" \
              "https://crates.io/api/v1/crates/revenuecat-rs/$V" >/dev/null; then
            echo "revenuecat-rs $V already on crates.io — skipping"
          else
            cargo publish --locked --no-verify --registry crates-io -p revenuecat-rs
          fi

      - name: Publish Tauri plugin (tauri-plugin-revenuecat)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          V=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tauri-plugin-revenuecat") | .version')
          if curl -sf -H "User-Agent: revenuecat-rs-release" \
              "https://crates.io/api/v1/crates/tauri-plugin-revenuecat/$V" >/dev/null; then
            echo "tauri-plugin-revenuecat $V already on crates.io — skipping"
          else
            cargo publish --locked --no-verify --registry crates-io -p tauri-plugin-revenuecat
          fi

  publish-npm:
    name: Publish npm (tauri-plugin-revenuecat)
    needs: publish-crates
    # Trusted Publishing signs Sigstore provenance and requires a GitHub-hosted
    # runner. Keep the release on the same explicit hosted image as CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (token-less)
    defaults:
      run:
        working-directory: crates/tauri-plugin-revenuecat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Verify bundled npm supports OIDC Trusted Publishing
        run: |
          version=$(npm --version)
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) process.exit(1);
          ' "$version"
          echo "npm $version supports trusted publishing"
      - name: Publish (idempotent — skip a version already on npm)
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_TYPE" = "tag"
          test "${GITHUB_REF_NAME#v}" = "$V" \
            || { echo "tag (${GITHUB_REF_NAME#v}) != package.json ($V)"; exit 1; }
          if npm view "tauri-plugin-revenuecat@$V" version >/dev/null 2>&1; then
            echo "tauri-plugin-revenuecat@$V already on npm — skipping"
            exit 0
          fi
          # Clean userconfig so no stray auth token shadows OIDC publishing.
          npm_config_userconfig=$(mktemp)
          export npm_config_userconfig
          npm publish --ignore-scripts
