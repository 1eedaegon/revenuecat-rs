name: CI

# Runs on the repo's self-hosted macOS ARM64 runner (free — GitHub-hosted
# minutes are exhausted for this private repo). The runner has rustup,
# sccache (local disk cache), cargo-deny, and the Android NDK preinstalled;
# its persistent workspace makes cache actions unnecessary.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  lint-and-test:
    name: Lint + test (SDK crates)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Runner PATH
        run: |
          # Later lines take PATH precedence: rustup's cargo must win over
          # the nix profile's rust-less cargo.
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy -p revenuecat-rs -p revenuecat-mock --all-targets -- -D warnings
      - name: tests
        run: cargo test -p revenuecat-rs -p revenuecat-mock --all-targets

  tauri-demo:
    name: Full workspace incl. Tauri demo
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Runner PATH
        run: |
          # Later lines take PATH precedence: rustup's cargo must win over
          # the nix profile's rust-less cargo.
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: clippy full workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (unit + integration + Tauri IPC)
        run: cargo test --workspace --all-targets

  guest-js:
    name: Guest JS build + tests
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: crates/tauri-plugin-revenuecat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  android-targets:
    name: Android Rust + Kotlin checks
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner PATH
        run: |
          # Later lines take PATH precedence: rustup's cargo must win over
          # the nix profile's rust-less cargo.
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Point cargo at the local NDK toolchain
        run: |
          TOOLCHAIN="$HOME/Library/Android/android-ndk-r27c/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: SDK core on Android target
        run: cargo check -p revenuecat-rs --target aarch64-linux-android
      - name: Tauri plugin (mobile cfg) on Android target
        run: cargo check -p tauri-plugin-revenuecat --target aarch64-linux-android
      - name: Generate the Android test host
        working-directory: demo/tauri-app/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.2 android init --ci --skip-targets-install
      - name: Kotlin bridge unit tests + lint
        working-directory: demo/tauri-app/src-tauri/gen/android
        run: >-
          ./gradlew
          :tauri-plugin-revenuecat:testDebugUnitTest
          :tauri-plugin-revenuecat:lintDebug

  audit:
    name: Dependency audit (cargo-deny)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Runner PATH
        run: |
          # Later lines take PATH precedence: rustup's cargo must win over
          # the nix profile's rust-less cargo.
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo-deny
        run: cargo-deny check advisories licenses bans sources
