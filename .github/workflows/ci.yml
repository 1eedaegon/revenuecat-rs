name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint + test (SDK crates, Linux)
    runs-on: ubuntu-latest
    # Compiler-level build cache; job-scoped so the containerized
    # cargo-deny action does not inherit a missing sccache binary.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy -p revenuecat-rs -p revenuecat-mock --all-targets -- -D warnings
      - name: tests
        run: cargo test -p revenuecat-rs -p revenuecat-mock

  tauri-demo:
    name: Full workspace incl. Tauri demo (macOS)
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: clippy full workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (unit + integration + Tauri IPC)
        run: cargo test --workspace

  audit:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
