# ARM iOS compile checks on the self-hosted runner (Xcode 16.1 installed;
# DEVELOPER_DIR comes from the runner's .env).

name: iOS targets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-targets:
    name: ARM iOS compile check (device + simulator)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Runner PATH
        run: |
          echo "/etc/profiles/per-user/$USER/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: SDK core on iOS device target
        run: cargo check -p revenuecat-rs --target aarch64-apple-ios
      - name: Tauri plugin (mobile cfg) on iOS device target
        run: cargo check -p tauri-plugin-revenuecat --target aarch64-apple-ios
      - name: Tauri plugin on iOS simulator target
        run: cargo check -p tauri-plugin-revenuecat --target aarch64-apple-ios-sim
      - name: Swift StoreKit bridge unit tests
        working-directory: crates/tauri-plugin-revenuecat/ios
        run: |
          simulator_id=$(xcrun simctl list devices available -j | \
            jq -r 'first(.devices[][] | select(.name | startswith("iPhone")) | .udid) // empty')
          test -n "$simulator_id"
          xcodebuild \
            -scheme tauri-plugin-revenuecat \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            test
