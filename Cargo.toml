[workspace]
resolver = "2"
members = [
    "crates/revenuecat",
    "crates/revenuecat-mock",
    "crates/tauri-plugin-revenuecat",
    "demo/tauri-app/src-tauri",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"
authors = ["Gon <d8726243@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# unwrap is banned in library code; tests are exempted via clippy.toml
# (allow-unwrap-in-tests). Use expect() with a reason, or propagate errors.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# `version` lets publishable crates (tauri-plugin-revenuecat) depend on the
# released revenuecat-rs from crates.io while using the local path in-workspace.
revenuecat-rs = { path = "crates/revenuecat", version = "1" }
revenuecat-mock = { path = "crates/revenuecat-mock" }

async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "fast"] }
rand = "0.10"
sha2 = "0.11"
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Bundled Mozilla roots so TLS works without the platform verifier — which on
# Android needs a JNI context the app can't easily provide.
rustls = "0.23"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
