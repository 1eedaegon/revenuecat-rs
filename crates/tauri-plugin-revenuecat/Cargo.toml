[package]
name = "tauri-plugin-revenuecat"
description = "Tauri 2 mobile plugin bridging StoreKit 2 / Play Billing into the revenuecat crate's StoreBilling seam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tauri-plugin-revenuecat"
readme = "README.md"
keywords = ["tauri", "revenuecat", "iap", "storekit", "play-billing"]
categories = ["api-bindings", "gui"]
links = "tauri-plugin-revenuecat"
# The `.tauri/` Swift helper is regenerated by the Tauri CLI in the consuming
# app's build tree, so it must not ship in the published package.
exclude = [".tauri"]

[lints]
workspace = true

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
revenuecat-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
thiserror = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
