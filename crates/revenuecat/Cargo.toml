[package]
name = "revenuecat"
description = "Unofficial RevenueCat SDK for Rust — protocol-compatible with the official mobile SDKs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["revenuecat", "iap", "subscriptions", "billing", "tauri"]
