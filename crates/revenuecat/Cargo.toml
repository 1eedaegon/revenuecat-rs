[package]
name = "revenuecat-rs"
description = "RevenueCat SDK for Rust: protocol-compatible with the official mobile SDKs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["revenuecat", "iap", "subscriptions", "billing", "tauri"]
categories = ["api-bindings"]
readme = "../../README.md"

[lints]
workspace = true

# Package is `revenuecat-rs` on crates.io; the library keeps the ergonomic
# import name: `use revenuecat::...`.
[lib]
name = "revenuecat"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
revenuecat-mock = { workspace = true }
tokio = { workspace = true, features = ["full"] }
